# Generic Nav2 (Jazzy) configuration with the DWARL RL policy as local planner.
# Robot-specific values (frames, footprint, scan topic, control rate, goal tolerance, behavior limits and the
# collision_monitor zones) are filled in at launch from the policy bundle's deploy.yaml by
# dwarl_bringup.nav.render_nav2_params (navigation.launch.py); the values below are only defaults.
controller_server:
  ros__parameters:
    controller_frequency: 10.0          # == deploy.yaml control.dt (policy trained at 10 Hz)
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.3            # == training goal_tolerance
      yaw_goal_tolerance: 6.3           # the policy does not control final heading
    FollowPath:
      plugin: "dwarl_controller::DwarlController"
      run: "latest"
      model_dir: ""
      dwarl_root: ""                   # "" -> $DWARL_ROOT (set by the dwarl_bringup env hook)
      expected_robot_id: ""             # set from deploy.yaml: refuse bundles of another robot
      scan_topic: scan
      scan_timeout: 0.5
      transform_tolerance: 0.2
      inference_threads: 1
      debug: true                       # observation-only RViz markers

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.205, -0.155], [-0.205, 0.155], [0.077, 0.155], [0.077, -0.155]]"  # from deploy.yaml
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, data_type: "LaserScan", clearing: true, marking: true, max_obstacle_height: 2.0,
               raytrace_max_range: 8.0, obstacle_max_range: 7.5, inf_is_valid: true}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, data_type: "LaserScan", clearing: true, marking: true, max_obstacle_height: 2.0,
               raytrace_max_range: 8.0, obstacle_max_range: 7.5, inf_is_valid: true}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    # GridBased is configured in planner_<planner>.yaml (launch arg planner:=navfn|smac2d)

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin: {plugin: "nav2_behaviors::Spin"}
    backup: {plugin: "nav2_behaviors::BackUp"}
    wait: {plugin: "nav2_behaviors::Wait"}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose: {plugin: "nav2_bt_navigator::NavigateToPoseNavigator"}
    navigate_through_poses: {plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"}
    error_code_names: [compute_path_error_code, follow_path_error_code]

# ------------------------------------------------------------------------------------------ safety layer
# Only used with `safety:=true` (default): controller_server publishes cmd_vel_raw -> collision_monitor -> cmd_vel.
# One velocity-dependent STOP zone ("SafetyStop"); its polygons are generated from the bundle's footprint and limits
# (footprint + 3.5 cm, stretched in the driving direction by the braking distance v^2 / (2 a) + v * 0.15 s).
# A STOP fails FollowPath (the DWARL plugin's safety_state_topic) and bt_navigator runs
# behavior_trees/dwarl_safety_retry.xml: back up, restart the policy, retry; replan/recover when retries run out.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0                 # stale scan -> stop
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["SafetyStop"]
    SafetyStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 2                     # scan returns inside the zone needed to trigger
      visualize: true
      polygon_pub_topic: "safety_stop_polygon"
      enabled: true
      holonomic: false
      velocity_polygons: []             # generated
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: true
