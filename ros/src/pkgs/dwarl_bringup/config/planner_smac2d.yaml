# Global planner for planner:=smac2d: Smac 2D (A* on the global costmap), no path-length cap.
# Heavier than NavFn; use it when routes exceed NavFn's limit (e.g. the s_turn scenario).
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
