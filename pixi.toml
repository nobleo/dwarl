# Workspace components: install dwarl/ as editable Python, build ros/ with colcon
# (build, runtime-build), and build web/ with npm (web-build).
[workspace]
name = "dwarl"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
dwarl = { path = "./dwarl", editable = true }

[activation]
scripts = ["scripts/pixi_activate.sh"]

[tasks]
dwarl = { cmd = "dwarl", description = "Run the DWARL command-line interface" }
train = { cmd = "dwarl train", description = "Train or resume a policy" }
setup = { cmd = "dwarl setup", description = "Select and check a robot" }
datagen = { cmd = "dwarl datagen", description = "Prepare training, validation and test maps" }
demo = { cmd = """\
  dwarl setup --example --yes \
  && dwarl train diffbot --preset navigation --show --num-envs 10 --set train.validation_cases=2 \
    --set train.data.train_maps=10 --set train.data.validation_maps=2 --set train.data.test_maps=1 \
    --set train.data.pairs_per_map=3 --set recipe.sim.realtime=true""", description = "Prepare the TurtleBot example and watch navigation training in MuJoCo" }
test = { cmd = "dwarl test", description = "Evaluate a policy checkpoint in simulation" }
deploy = { cmd = "dwarl deploy", description = "Install a compatible policy bundle into a robot integration" }
doctor = { cmd = "dwarl doctor", description = "Check the selected simulator and robot prerequisites" }
web = { cmd = "dwarl web", description = "Start the local training and testing dashboard" }

[feature.web.dependencies]
nodejs = ">=22,<23"

[feature.web.tasks]
web-build = { cmd = "npm --prefix web ci && npm --prefix web run build && pixi run -e docs docs-web", description = "Build the dashboard and its embedded documentation" }
web-test = { cmd = "npm --prefix web test", depends-on = ["web-build"], description = "Run dashboard browser tests against freshly built assets" }

[feature.dev.pypi-dependencies]
pytest = ">=8"
ruff = ">=0.6"
pre-commit = ">=4, <5"

[feature.dev.tasks]
pytest = { cmd = "pytest -q", env = { OMP_NUM_THREADS = "1", MKL_NUM_THREADS = "1", PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" }, description = "Run the Python test suite with single-threaded numerical libraries" }
lint = { cmd = "ruff check .", description = "Check repository source with Ruff" }

[feature.docs.dependencies]
python = "3.12.*"

[feature.docs.pypi-dependencies]
mkdocs = "==1.6.1"
mkdocs-material = "==9.6.14"
mkdocs-gen-files = "==0.5.0"
omegaconf = "==2.3.0"
hydra-core = "==1.3.2"
rich-argparse = ">=1.6"
argcomplete = ">=3.5"

[feature.docs.tasks]
docs = { cmd = "mkdocs build --strict --config-file web/mkdocs.yml", description = "Build the documentation with strict link and configuration checks" }
docs-serve = { cmd = "mkdocs serve --config-file web/mkdocs.yml", description = "Serve a live preview of the documentation" }
docs-web = { cmd = "python web/scripts/build_docs.py", description = "Generate the documentation embedded in the dashboard" }

[feature.ros-base.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
make = "*"
pkg-config = "*"
onnxruntime-cpp = "*"
nlohmann_json = "*"
pyyaml = "*"
binutils = ">=2.46.1,<3"

[feature.ros.dependencies]
ros-jazzy-nav2-mppi-controller = "*"
ros-jazzy-nav2-minimal-tb3-sim = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-ament-cmake-pytest = "*"
gz-transport13 = "*"  # Python ground-truth bindings (gz.transport13 / gz.msgs10)
gz-msgs10 = "*"
# Packages commonly used by robot bringup/Gazebo integrations; `dwarl setup` reports any others
ros-jazzy-slam-toolbox = "*"
ros-jazzy-laser-filters = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-joy = "*"
ros-jazzy-teleop-twist-joy = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-diagnostic-common-diagnostics = "*"
ros-jazzy-rqt-reconfigure = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-joint-state-broadcaster = "*"

[feature.ros.tasks]
build = { cmd = "colcon --log-base ros/log build --symlink-install --base-paths ros/src --build-base ros/build --install-base ros/install --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo", env = { ONNXRUNTIME_ROOT = "$CONDA_PREFIX" }, description = "Build DWARL ROS packages with colcon" }
build-robot = { cmd = "bash ros/scripts/pixi_build_robot.sh", depends-on = ["build"], description = "Build the selected robot packages against DWARL" }
ros-test = { cmd = "colcon --log-base ros/log test --base-paths ros/src --build-base ros/build --install-base ros/install --event-handlers console_direct+ && colcon --log-base ros/log test-result --test-result-base ros/build --verbose", depends-on = ["build"], description = "Build and test the ROS packages, then report colcon results" }
# Workflow preparation builds ROS only when the requested operation needs it.

[feature.runtime.dependencies]
python = "3.12.*"

[feature.runtime.tasks]
runtime-build = { cmd = "colcon --log-base ros/log build --symlink-install --base-paths ros/src --build-base ros/build-runtime --install-base ros/install-runtime --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF", env = { ONNXRUNTIME_ROOT = "$CONDA_PREFIX" }, description = "Build the native Nav2 runtime without the training stack" }
runtime-launch = { cmd = "bash ros/scripts/pixi_runtime.sh", depends-on = ["runtime-build"], description = "Build and launch the native policy runtime" }

[environments]
# default has ROS/Gazebo because `dwarl test --sim gazebo|both` launches the stack itself.
default = { features = ["ros-base", "ros", "web", "dev"], solve-group = "all" }
train = { features = ["dev"], solve-group = "all" }  # slim: no ROS (clusters, CI)
docs = { features = ["docs"], no-default-feature = true }  # slim: mkdocs only, as in CI
runtime = { features = ["ros-base", "runtime"], no-default-feature = true }  # native Nav2 + inference, no training stack
