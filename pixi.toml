[workspace]
name = "dwarl"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
nodejs = ">=22,<23"

[pypi-dependencies]
dwarl = { path = ".", editable = true }
dwarl-runtime = { path = "runtime", editable = true }

[activation]
scripts = ["scripts/pixi_activate.sh"]

[tasks]
dwarl = "dwarl"
train = "dwarl train"
setup = "dwarl setup"
test = "dwarl test"
deploy = "dwarl deploy"
doctor = "dwarl doctor"
web = "dwarl web"
web-build = "npm --prefix web ci && npm --prefix web run build && pixi run -e docs docs-web"

[feature.dev.pypi-dependencies]
pytest = ">=8"
ruff = ">=0.6"

[feature.dev.tasks]
pytest = { cmd = "pytest -q", env = { OMP_NUM_THREADS = "1", MKL_NUM_THREADS = "1", PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
lint = "ruff check ."

[feature.docs.dependencies]
python = "3.12.*"

[feature.docs.pypi-dependencies]
mkdocs = "==1.6.1"
mkdocs-material = "==9.6.14"
mkdocs-gen-files = "==0.5.0"
omegaconf = "==2.3.0"
hydra-core = "==1.3.2"
rich-argparse = ">=1.6"
argcomplete = ">=3.5"

[feature.docs.tasks]
docs = "mkdocs build --strict --config-file web/mkdocs.yml"
docs-serve = "mkdocs serve --config-file web/mkdocs.yml"
docs-web = "python web/scripts/build_docs.py"

[feature.ros.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-nav2-mppi-controller = "*"
ros-jazzy-nav2-minimal-tb3-sim = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-ament-cmake-pytest = "*"
gz-transport13 = "*"  # Python ground-truth bindings (gz.transport13 / gz.msgs10)
gz-msgs10 = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
make = "*"
onnxruntime-cpp = "*"
nlohmann_json = "*"
pyyaml = "*"
# Packages commonly used by robot bringup/Gazebo integrations; `dwarl setup` reports any others
ros-jazzy-slam-toolbox = "*"
ros-jazzy-laser-filters = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-joy = "*"
ros-jazzy-teleop-twist-joy = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-diagnostic-common-diagnostics = "*"
ros-jazzy-rqt-reconfigure = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-joint-state-broadcaster = "*"
binutils = ">=2.46.1,<3"

[feature.ros.tasks]
build = { cmd = "colcon build --symlink-install --base-paths ros/src --build-base ros/build --install-base ros/install --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo", env = { ONNXRUNTIME_ROOT = "$CONDA_PREFIX" } }
build-robot = { cmd = "bash scripts/pixi_build_robot.sh", depends-on = ["build"] }
ros-test = { cmd = "colcon test --base-paths ros/src --build-base ros/build --install-base ros/install --event-handlers console_direct+ && colcon test-result --test-result-base ros/build --verbose", depends-on = ["build"] }
# Workflow preparation builds ROS only when the requested operation needs it.

[feature.runtime.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
make = "*"
pkg-config = "*"
onnxruntime-cpp = "*"
nlohmann_json = "*"
pyyaml = "*"
binutils = ">=2.46.1,<3"

[feature.runtime.pypi-dependencies]
dwarl-runtime = { path = "runtime", editable = true }

[feature.runtime.tasks]
runtime-build = { cmd = "colcon build --symlink-install --base-paths ros/src --build-base ros/build-runtime --install-base ros/install-runtime --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF", env = { ONNXRUNTIME_ROOT = "$CONDA_PREFIX" } }
runtime-launch = { cmd = "bash scripts/pixi_runtime.sh", depends-on = ["runtime-build"] }

[environments]
# default has ROS/Gazebo because `dwarl test --sim gazebo|both` launches the stack itself.
default = { features = ["ros", "dev"], solve-group = "all" }
train = { features = ["dev"], solve-group = "all" }  # slim: no ROS (clusters, CI)
docs = { features = ["docs"], no-default-feature = true }  # slim: mkdocs only, as in CI
runtime = { features = ["runtime"], no-default-feature = true }  # native Nav2 + inference, no training stack
