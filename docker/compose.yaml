# DWARL in Docker. Usage: docker/README.md. GPU: add compose.gpu.yaml (docker/configure-host.sh does this).
name: dwarl

x-dwarl: &dwarl
  image: dwarl:jazzy
  build:
    context: ..
    dockerfile: docker/Dockerfile
    additional_contexts:
      cindy_description: ${CINDY_DESCRIPTION_REPO:-../../cindy_description}
    args:
      CINDY_DESCRIPTION_REF: ${CINDY_DESCRIPTION_REF:-origin/feature/namespace}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    HOME: /tmp/home
    DISPLAY: ${DISPLAY:-:0}
    XAUTHORITY: /tmp/.Xauthority
    QT_X11_NO_MITSHM: "1"
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  volumes:
    - ${DWARL_WORK:-../work}:/work
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTH_FILE:-/dev/null}:/tmp/.Xauthority:ro
  ipc: host          # shared memory for DDS, Gazebo and the MuJoCo viewer
  shm_size: 2gb
  stdin_open: true
  tty: true

services:
  demo:            # docker compose run --rm demo  (interactive end-to-end demo, see docker/README.md)
    <<: *dwarl
    environment:
      HOME: /tmp/home
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      DEMO_ROBOT: ${DEMO_ROBOT:-}
      DEMO_PRESET: ${DEMO_PRESET:-}
      DEMO_STAGES: ${DEMO_STAGES:-}
      DEMO_YES: ${DEMO_YES:-}
    command: python -m dwarl_demo

  shell:
    <<: *dwarl
    command: bash

  tensorboard:
    <<: *dwarl
    profiles: [monitor]
    stdin_open: false
    tty: false
    ports: ["127.0.0.1:6006:6006"]
    command: tensorboard --logdir /work/runs --host 0.0.0.0 --port 6006
