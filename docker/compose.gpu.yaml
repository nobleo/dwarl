# NVIDIA GPU for PyTorch (training/export) and OpenGL (Gazebo, RViz, MuJoCo viewer).
# Requires the NVIDIA container toolkit on the host (docker/README.md).
services:
  demo: &gpu
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu, compute, utility, graphics]}]
  shell:
    <<: *gpu
  tensorboard:
    <<: *gpu
