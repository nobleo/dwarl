site_name: DWARL
site_description: Train, test and deploy a neural local planner
site_url: https://nobleo.github.io/dwarl/
repo_url: https://github.com/nobleo/dwarl
theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
extra_css:
  - stylesheets/nobleo.css
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Start:
    - Try the example: quickstart.md
    - Integrate your robot: integrate-robot.md
  - Workflow:
    - Train: train.md
    - Test and understand results: test.md
    - Deploy to Nav2: deploy.md
  - How-to:
    - Add Gazebo: gazebo.md
    - Monitor and resume: monitor.md
    - Compare controllers: compare.md
    - Troubleshooting: troubleshooting.md
  - Reference:
    - CLI: reference.md
    - Robot profile: reference/robot-profile.md
    - Configuration: configuration.md
    - All defaults: reference/configuration.md
    - Results and measurements: results.md
    - Manual integration contracts: manual-integration.md
    - ROS builds: ros.md
  - Contributing:
    - Development: contributing.md
    - Documentation: documentation.md
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/docs_reference.py
