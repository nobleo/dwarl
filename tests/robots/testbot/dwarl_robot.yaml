schema: dwarl_robot/1
id: testbot
description:
  urdf: testbot.urdf
  base_link: base_link
drive:
  type: diff
  left_wheel_joint: left_joint
  right_wheel_joint: right_joint
  actuator: {kv: 1.0, max_wheel_speed: 25.0, max_torque: 2.0}
limits: {v_min: -0.1, v_max: 0.6, w_max: 1.5, a_max: 1.0, alpha_max: 3.0}
footprint:
  polygon: [[0.21, 0.16], [0.21, -0.16], [-0.1, -0.16], [-0.1, 0.16]]
lidar: {link: laser, num_rays: 90, fov_deg: 240.0, min_range: 0.05, max_range: 6.0, noise_std: 0.0, dropout_prob: 0.0}
collision:
  remove_links: [caster]
  supports: [{pos: [0.17, 0.0, -0.03], radius: 0.02}]
  chassis_z: [-0.02, 0.15]
physics:
  joints:
    - {joint: left_joint, damping: 0.01, armature: 0.001}
    - {joint: right_joint, damping: 0.01, armature: 0.001}
ros:
  base_frame: base_link
  scan_topic: scan
